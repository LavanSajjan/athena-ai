name: Athena CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Show Python Environment
        run: |
          pwd
          ls -la
          uv run python -c "import sys; print(sys.path)"

      - name: Verify Package Imports
        run: |
          uv run python -c "import packages; print('packages imported successfully')"
          uv run python -c "from packages.loaders.csv import CSVLoader; print('CSVLoader OK')"

      - name: Ruff
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy apps packages tests

      - name: Pytest
        run: uv run pytest