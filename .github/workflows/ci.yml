name: Athena CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Debug Environment
        run: |
          echo "========================"
          echo "Working Directory"
          echo "========================"
          pwd

          echo ""
          echo "========================"
          echo "Repository Contents"
          echo "========================"
          ls -la

          echo ""
          echo "========================"
          echo "packages/"
          echo "========================"
          ls -la packages

          echo ""
          echo "========================"
          echo "packages/__init__.py"
          echo "========================"
          ls -la packages/__init__.py

          echo ""
          echo "========================"
          echo "Python Version"
          echo "========================"
          uv run python --version

          echo ""
          echo "========================"
          echo "Python Search Path"
          echo "========================"
          uv run python -c "import sys; print('\n'.join(sys.path))"

          echo ""
          echo "========================"
          echo "Installed Packages"
          echo "========================"
          uv pip list

      - name: Verify Package Imports
        run: |
          echo "========================"
          echo "Import packages"
          echo "========================"
          uv run python -c "import packages; print(packages)"
          uv run python -c "import packages; print(packages.__file__)"

          echo ""
          echo "========================"
          echo "Import CSV Loader"
          echo "========================"
          uv run python -c "from packages.loaders.csv import CSVLoader; print(CSVLoader)"

          echo ""
          echo "========================"
          echo "Import Storage Provider"
          echo "========================"
          uv run python -c "from packages.storage.blob.local import LocalStorageProvider; print(LocalStorageProvider)"

      - name: Ruff
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy apps packages tests

      - name: Pytest
        run: uv run pytest