################################################################################
# ATHENA AI
#
# Root Workspace Configuration
#
# This repository is intentionally NOT packaged.
# It is an application workspace managed by uv.
################################################################################

[tool.uv]

package = false

################################################################################
# Runtime Dependencies
################################################################################

dependency-groups = { }

[dependency-groups]

runtime = [

    # ----------------------------
    # API
    # ----------------------------
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",

    # ----------------------------
    # UI
    # ----------------------------
    "streamlit>=1.49.0",

    # ----------------------------
    # Configuration
    # ----------------------------
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",

    # ----------------------------
    # Environment
    # ----------------------------
    "python-dotenv>=1.1.1",

    # ----------------------------
    # Logging
    # ----------------------------
    "loguru>=0.7.3",

    "rich>=14.1.0",

    # ----------------------------
    # Networking
    # ----------------------------
    "httpx>=0.28.1",

    # ----------------------------
    # CLI
    # ----------------------------
    "typer>=0.17.4",

    # ----------------------------
    # Data
    # ----------------------------
    "pandas>=2.3.2",
    "numpy>=2.3.2",
    "plotly>=6.3.0",
    "polars>=1.32.3",
]

################################################################################
# Development
################################################################################

dev = [

    "ruff>=0.12.9",

    "mypy>=1.17.1",

    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.0.0",

    "pre-commit>=4.3.0",
]

################################################################################
# Future AI Providers
################################################################################

ai = [

    "google-genai",

    "openai",

    "anthropic",

    "langgraph",

    "langchain",
]

################################################################################
# Database Connectors
################################################################################

database = [

    "duckdb",

    "sqlalchemy",

    "psycopg[binary]",

    "pymssql",

    "snowflake-connector-python",
]

################################################################################
# Ruff
################################################################################

[tool.ruff]

line-length = 100

target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

################################################################################
# Formatter
################################################################################

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

################################################################################
# Mypy
################################################################################

[tool.mypy]

python_version = "3.12"

strict = true

ignore_missing_imports = true

warn_unused_configs = true

################################################################################
# Pytest
################################################################################

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]uv sync --group runtime --group dev