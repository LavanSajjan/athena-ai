################################################################################
# ATHENA AI
################################################################################

[project]
name = "athena-ai"
version = "0.4.1-alpha"
description = "Athena AI"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv]
package = false

################################################################################
# Dependency Groups
################################################################################

[dependency-groups]

runtime = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "streamlit>=1.49.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
    "rich>=14.1.0",
    "httpx>=0.28.1",
    "typer>=0.17.4",
    "pandas>=2.3.2",
    "numpy>=2.3.2",
    "plotly>=6.3.0",
    "polars>=1.32.3",
    "fastexcel>=0.17.0",
    "duckdb>=1.5.5",
]

dev = [
    "ruff>=0.12.9",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.3.0",
]

ai = [
    "google-genai",
    "openai",
    "anthropic",
    "langgraph",
    "langchain",
]

database = [
    "sqlalchemy",
    "psycopg[binary]",
    "pymssql",
    "snowflake-connector-python",
]

################################################################################
# Ruff
################################################################################

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

################################################################################
# MyPy
################################################################################

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true

files = [
    "apps",
    "packages",
    "tests",
]

################################################################################
# Pytest
################################################################################

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

pythonpath = [
    ".",
]